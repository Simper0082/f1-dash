[env:wheel_leds]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    fastled/FastLED@^3.7.0
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
; after the first USB flash the board is sealed in the wheel, so updates go over Wi-Fi:
;   pio run -t upload --upload-port <wheel ip>   (set upload_protocol = espota)
